[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "credit-card-fraud-detection"
dynamic = ["version"]
description = "A reproducible, leakage-safe credit-card fraud detection system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Credit Card Fraud Detection contributors" }]
keywords = ["fraud-detection", "machine-learning", "imbalanced-classification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "pydantic>=2.6,<3",
  "scikit-learn>=1.3,<2",
  "typer>=0.12,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "mypy>=1.10,<3",
  "pandas-stubs>=2.0",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[project.scripts]
fraud-detect = "fraud_detection.cli:app"

[project.urls]
Homepage = "https://github.com/Mohamed-ahmed-shokry/Credit-Card-Fraud-Detection"
Issues = "https://github.com/Mohamed-ahmed-shokry/Credit-Card-Fraud-Detection/issues"
Repository = "https://github.com/Mohamed-ahmed-shokry/Credit-Card-Fraud-Detection.git"

[tool.hatch.version]
path = "src/fraud_detection/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.coverage.run]
branch = true
source = ["fraud_detection"]

[tool.coverage.report]
fail_under = 97
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "EXE",
  "F",
  "I",
  "ICN",
  "INP",
  "N",
  "PERF",
  "PIE",
  "PTH",
  "Q",
  "RET",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T20",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fraud_detection"]
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "truthy-bool",
  "unused-awaitable",
]

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
