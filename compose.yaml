services:
  fraud-api:
    build:
      context: .
    image: credit-card-fraud-detection:local
    environment:
      FRAUD_MODEL_PATH: /app/artifacts/model
      # Enable fail-closed startup admission by setting both paths together.
      # FRAUD_ATTESTATION_PATH: /app/admission/attestation.json
      # FRAUD_TRUST_BUNDLE_PATH: /app/admission/trust-bundle.json
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts/model:/app/artifacts/model:ro
      # Mount admission evidence and its rotation-aware trust bundle read-only.
      # - ./admission:/app/admission:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
