name: TestPyPI Dry Run

# Runs on every push to main. Like publish.yml, it needs a trusted publisher
# linked before it can succeed -- this time on test.pypi.org (project settings
# there, "Publishing" section). Configure:
#   - TestPyPI Project name: credit-card-fraud-detection
#   - Owner: Mohamed-ahmed-shokry
#   - Repository name: Credit-Card-Fraud-Detection
#   - Workflow name: test-pypi.yml
# (no environment restriction, unlike the PyPI release workflow)

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-pypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip && python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      # Exercise the release SBOM mechanism on every push so tool or flag
      # drift surfaces here instead of at release time. The file itself is
      # discarded; releases keep the uploaded copy.
      - name: Install release candidate
        run: python -m pip install dist/*.whl

      - name: Install SBOM tooling
        run: python -m pip install "cyclonedx-bom>=7,<8"

      - name: Generate SBOM
        run: >
          python -m cyclonedx_py environment
          --pyproject pyproject.toml
          --mc-type library
          --output-reproducible
          --output-format JSON
          --output-file sbom/sbom.cdx.json

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/