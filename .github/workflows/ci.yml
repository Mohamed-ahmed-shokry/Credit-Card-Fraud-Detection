name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Audit dependencies
        run: python -m pip_audit --skip-editable

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src

      - name: Test with branch coverage
        run: python -m pytest --cov=fraud_detection --cov-report=term-missing

      - name: Build distributions
        run: python -m build

      - name: Smoke test installed wheel
        run: |
          smoke_venv=/tmp/fraud-wheel-smoke
          expected_version=$(python -c "from fraud_detection import __version__; print(__version__)")
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --quiet dist/*.whl
          (
            cd /tmp
            test "$("$smoke_venv/bin/fraud-detect" --version)" = "$expected_version"
          )

      - name: Check package metadata
        run: python -m twine check dist/*

  admission:
    name: Signed artifact admission
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Generate, sign, rotate, and verify admission evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fraud-admission
          fraud-detect generate-data --output /tmp/fraud-admission/data.csv --rows 800 --seed 19
          fraud-detect train /tmp/fraud-admission/data.csv --output /tmp/fraud-admission/model
          fraud-detect generate-signing-key \
            --private-key /tmp/fraud-admission/private.pem \
            --public-key /tmp/fraud-admission/public.pem
          fraud-detect generate-signing-key \
            --private-key /tmp/fraud-admission/next-private.pem \
            --public-key /tmp/fraud-admission/next-public.pem
          fraud-detect generate-trust-bundle \
            --output /tmp/fraud-admission/trust.json \
            --public-key /tmp/fraud-admission/public.pem
          old_key_id=$(python -c "from fraud_detection.signing import load_public_key, public_key_fingerprint; print(public_key_fingerprint(load_public_key('/tmp/fraud-admission/public.pem')))" )
          fraud-detect validate-artifact /tmp/fraud-admission/model --strict \
            --attestation-output /tmp/fraud-admission/attestation.json \
            --signer ci-admission \
            --signing-key /tmp/fraud-admission/private.pem
          fraud-detect verify-attestation /tmp/fraud-admission/attestation.json \
            --trust-bundle /tmp/fraud-admission/trust.json
          fraud-detect rotate-trust-bundle /tmp/fraud-admission/trust.json \
            --output /tmp/fraud-admission/rotated-trust.json \
            --add-public-key /tmp/fraud-admission/next-public.pem \
            --revoke-key-id "$old_key_id"
          if fraud-detect verify-attestation /tmp/fraud-admission/attestation.json \
            --trust-bundle /tmp/fraud-admission/rotated-trust.json; then
            echo "Revoked signing key was incorrectly admitted." >&2
            exit 1
          fi

  container:
    name: Container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build API image
        run: docker build --tag credit-card-fraud-detection:test .

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Train a demo model for the smoke test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          fraud-detect generate-data --output /tmp/demo.csv --rows 2000
          fraud-detect train /tmp/demo.csv --output artifacts/model

      - name: Smoke test the container image
        run: |
          docker run --detach --name fraud-api --publish 8000:8000 \
            --volume "$PWD/artifacts/model:/app/artifacts/model:ro" \
            credit-card-fraud-detection:test
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy in time." >&2
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs fraud-api

      - name: Stop the container
        if: always()
        run: docker rm --force fraud-api
