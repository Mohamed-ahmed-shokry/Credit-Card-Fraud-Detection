name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Audit dependencies
        run: python -m pip_audit --skip-editable

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src

      - name: Test with branch coverage
        run: python -m pytest --cov=fraud_detection --cov-report=term-missing

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

  container:
    name: Container
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build API image
        run: docker build --tag credit-card-fraud-detection:test .

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Train a demo model for the smoke test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          fraud-detect generate-data --output /tmp/demo.csv --rows 2000
          fraud-detect train /tmp/demo.csv --output artifacts/model

      - name: Smoke test the container image
        run: |
          docker run --detach --name fraud-api --publish 8000:8000 \
            --volume "$PWD/artifacts/model:/app/artifacts/model:ro" \
            credit-card-fraud-detection:test
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy in time." >&2
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs fraud-api

      - name: Stop the container
        if: always()
        run: docker rm --force fraud-api
