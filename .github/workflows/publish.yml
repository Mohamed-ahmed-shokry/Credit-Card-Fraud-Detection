name: Publish to PyPI

# Runs when a GitHub Release is published. It will not succeed until the
# PyPI trusted publisher is configured for this repository -- see
# https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
# for a project that has never been published before (this one), or
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/ once it
# exists on PyPI. Configure:
#   - PyPI Project name: credit-card-fraud-detection
#   - Owner: Mohamed-ahmed-shokry
#   - Repository name: Credit-Card-Fraud-Detection
#   - Workflow name: publish.yml
#   - Environment name: pypi
# No API token or secret is needed; trusted publishing uses this
# workflow's OIDC identity instead.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip && python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/credit-card-fraud-detection
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
