name: Publish to PyPI

# Runs when a GitHub Release is published. It will not succeed until the
# PyPI trusted publisher is configured for this repository -- see
# https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
# for a project that has never been published before (this one), or
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/ once it
# exists on PyPI. Configure:
#   - PyPI Project name: credit-card-fraud-detection
#   - Owner: Mohamed-ahmed-shokry
#   - Repository name: Credit-Card-Fraud-Detection
#   - Workflow name: publish.yml
#   - Environment name: pypi
# No API token or secret is needed; trusted publishing uses this
# workflow's OIDC identity instead. The build job also records a CycloneDX
# SBOM of the installed release candidate and uploads it as the `sbom`
# workflow artifact for downstream auditors.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip && python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # Inventory exactly what ships: install the wheel so runtime
      # dependencies are present, then record the environment as SBOM.
      - name: Install release candidate
        run: python -m pip install dist/*.whl

      - name: Install SBOM tooling
        run: python -m pip install "cyclonedx-bom>=7,<8"

      - name: Generate SBOM
        run: >
          python -m cyclonedx_py environment
          --pyproject pyproject.toml
          --mc-type library
          --output-reproducible
          --output-format JSON
          --output-file sbom/sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/credit-card-fraud-detection
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: Publish signed container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: docker_meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/mohamed-ahmed-shokry/credit-card-fraud-detection
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless signing: cosign uses this job's OIDC identity, so no private
      # key or secret is stored anywhere.
      - name: Sign image
        env:
          TAGS: ${{ steps.docker_meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
